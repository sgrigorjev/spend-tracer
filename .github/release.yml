# GitHub release notes configuration. The categories below group merged PRs
# into the auto-generated notes for a new release.
#
# Rule: any PR that archives an OpenSpec change (moves openspec/changes/<name>/
# to openspec/changes/archive/) must carry the `ignore-for-release` label, so
# archive churn stays out of the release notes. The exclude block below drops
# those PRs, and the automated dependency PRs, from every release.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - renovate
      - github-actions
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 🧰 Maintenance
      labels:
        - chore
        - dependencies
    - title: 📝 Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
