# Dependabot: weekly updates for npm, container base images and GitHub Actions.
# Minor and patch updates are grouped per ecosystem to keep the PR count down;
# major updates arrive on their own. Each entry sets a 7-day cooldown so a
# freshly published (possibly malicious) version is not proposed immediately.
# Dependabot PRs are kept out of the release notes by author in
# .github/release.yml.
#
# shared/ is not listed: it has no dependencies and no lockfile.
# web/Dockerfile's nginx:alpine is a floating tag, so Dependabot cannot track
# it until the image is pinned to a version tag.
version: 2
updates:
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      bot-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      api-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /bot
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
