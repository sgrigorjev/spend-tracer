services:
  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"
    depends_on:
      - api
